# Telegraf configuration for the JMeter -> Kafka -> InfluxDB v2 pipeline.
# The JMeter plugin publishes InfluxDB line protocol to Kafka, so
# data_format must be "influx".
#
# Start with: telegraf --config telegraf.conf

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"
  flush_jitter = "2s"
  collection_jitter = "0s"
  # JMeter points already carry a nodeName tag. Adding Telegraf's host tag
  # would create unnecessary series, so drop it.
  omit_hostname = true

[[inputs.kafka_consumer]]
  brokers = ["localhost:9092"]
  topics = ["jmeter-metrics"]
  consumer_group = "jmeter-influx-writer"
  # Required: the plugin writes InfluxDB line protocol, not JSON.
  data_format = "influx"
  # A brand-new consumer group starts at the newest offset. Committed
  # offsets are still honored after a restart.
  offset = "newest"
  # Messages buffered in Telegraf before being acknowledged. Raise this
  # when InfluxDB writes are slow, at the cost of more memory.
  max_undelivered_messages = 2000

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "YOUR_TOKEN"
  organization = "YOUR_ORG"
  bucket = "jmeter"
